<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex Kanto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--red:#f7313e;--dark:#8f1119;--screen:#cfe8d0;--ink:#1b2a1f;--panel:#f3f0e8;--page-bg:#5a0a10;--card-bg:#e9f5ea;--border:#333;--field-bg:#fff;--line:#d6d1c3;--hover:#ffe3a8;--hover-strong:#ffd06a;--bar-bg:#a9c9ab;--bar-fill:#8f1119}
:root[data-theme="dark"]{--screen:#263b30;--ink:#e8eee7;--panel:#242a30;--page-bg:#15191d;--card-bg:#34463a;--border:#aab5ac;--field-bg:#303941;--line:#49534d;--hover:#4c4030;--hover-strong:#665330;--bar-bg:#516d59;--bar-fill:#f1cf65}
*{box-sizing:border-box}
body{margin:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--page-bg);font-family:"Press Start 2P","Trebuchet MS",Verdana,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:0}
input,select,button{font-family:inherit}
.dex{width:100%;height:100vh;height:100dvh;min-height:0;background:var(--red);border:4px solid var(--dark);border-radius:0;padding:16px;box-shadow:none;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lens{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9ecff,#1d8fd1 60%,#0b5a8a);border:4px solid #fff}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #333}
.dot.r{background:#ff5a4f}.dot.y{background:#ffd33d}.dot.g{background:#47d36b}
h1{margin:0 0 0 auto;font-size:1.3rem;color:#fff;letter-spacing:1px}
.tema{flex:none;background:var(--card-bg);color:var(--ink);border:2px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.tema:hover{background:var(--hover)}
.main{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;flex:1;min-height:0}
.screen{background:var(--screen);border:4px solid var(--border);border-radius:12px;padding:14px;min-height:0;box-shadow:inset 0 0 12px rgba(0,0,0,.25)}
.hero{display:flex;align-items:center;gap:12px}
.hero img{width:150px;height:150px;image-rendering:auto;background:var(--card-bg);border:3px solid var(--border);border-radius:10px}
.hero h2{margin:0;font-size:1.5rem;text-transform:capitalize}
:root[data-theme="dark"] .num{color:#fff1a6;opacity:1}
.num{font-weight:bold;opacity:.7}
.tipos{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tipo{color:#fff;padding:2px 10px;border-radius:999px;font-size:.8rem;border:2px solid rgba(0,0,0,.35)}
.info{margin:8px 0 0;font-size:.85rem}
h3{margin:14px 0 6px;font-size:.95rem}
.stat{display:grid;grid-template-columns:minmax(0,1.2fr) 34px minmax(0,2fr);align-items:center;gap:6px;font-size:.82rem;margin:3px 0}
.stat span{min-width:0;overflow-wrap:anywhere}
.bar{height:10px;background:var(--bar-bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar-fill);border-radius:6px}
.evo{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.evo button{background:var(--card-bg);color:var(--ink);border:2px solid var(--border);border-radius:10px;padding:2px 6px;cursor:pointer;font:inherit;font-size:.75rem;text-transform:capitalize}
.evo button img{display:block;width:56px;height:56px;margin:auto}
.evo button:hover{background:var(--field-bg)}
.evo span{font-weight:bold}
.side{background:var(--panel);border:4px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:0}
.filtros{display:flex;gap:8px;margin-bottom:8px}
input,select{font:inherit;padding:8px;border:2px solid var(--border);border-radius:8px;min-width:0;background:var(--field-bg);color:var(--ink)}
input{flex:1}
.aleatorio{font:inherit;padding:8px;border:2px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--hover);color:var(--ink)}
.aleatorio:hover:not(:disabled){background:var(--hover-strong)}
.aleatorio:disabled{cursor:wait;opacity:.6}
.lista{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;flex:1}
.lista li button{width:100%;text-align:left;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:7px 6px;font:inherit;cursor:pointer;text-transform:capitalize;display:flex;gap:8px;align-items:center}
.lista li button:hover,.lista li button.on{background:var(--hover)}
.lista img{width:36px;height:36px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1d8fd1;outline-offset:1px}
.msg{padding:20px;text-align:center}
@media(max-width:720px){
  body{height:auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto}
  .dex{height:auto;min-height:100vh;min-height:100dvh;padding:12px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto clamp(300px,45dvh,460px);gap:10px}
  .screen{min-height:0}
  .side{min-height:0}
  .hero img{width:clamp(88px,27vw,120px);height:clamp(88px,27vw,120px);flex:none}
  .filtros{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  input,select,.aleatorio{font-size:.65rem}
  button{min-height:40px}
}
@media(max-width:480px){
  .top{gap:5px}
  .lens{width:34px;height:34px;flex:none}
  .dot{width:11px;height:11px;flex:none}
  h1{font-size:.65rem;letter-spacing:0}
  .tema{padding:6px 8px}
  .screen{padding:10px}
  .hero{gap:8px}
  .hero h2{font-size:1rem;overflow-wrap:anywhere}
  .info{font-size:.65rem;line-height:1.6}
  h3{font-size:.75rem}
  .stat{font-size:.62rem;grid-template-columns:minmax(0,1.2fr) 28px minmax(0,2fr);gap:4px}
  .tipo{font-size:.65rem}
  .evo button{font-size:.6rem}
}
</style>
</head>
<body>
<div class="dex">
  <div class="top"><div class="lens"></div><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><h1>POKÉDEX · KANTO</h1><button class="tema" id="tema" type="button" aria-label="Ativar modo escuro" aria-pressed="false">☾</button></div>
  <div class="main">
    <section class="screen" id="tela" aria-live="polite"><p class="msg">Carregando...</p></section>
    <section class="side">
      <div class="filtros">
        <input id="busca" type="search" placeholder="Nome ou número (1–151)" aria-label="Buscar Pokémon">
        <select id="tipo" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option></select>
      </div>
      <button class="aleatorio" id="aleatorio" type="button" disabled>Pokémon aleatório</button>
      <ul class="lista" id="lista"></ul>
    </section>
  </div>
</div>

<script>
const API = "https://pokeapi.co/api/v2/";
const IMG = id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + id + ".png";
const SMALL = id => "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" + id + ".png";

const TIPOS = {normal:["Normal","#a8a878"],fire:["Fogo","#f08030"],water:["Água","#6890f0"],electric:["Elétrico","#e0b010"],grass:["Planta","#78c850"],ice:["Gelo","#58c8c8"],fighting:["Lutador","#c03028"],poison:["Veneno","#a040a0"],ground:["Terra","#b8964a"],flying:["Voador","#8f78e0"],psychic:["Psíquico","#f85888"],bug:["Inseto","#a8b820"],rock:["Pedra","#a08828"],ghost:["Fantasma","#705898"],dragon:["Dragão","#7038f8"],dark:["Sombrio","#705848"],steel:["Aço","#8888a8"],fairy:["Fada","#ee99ac"]};
const STATS = {hp:"Vida",attack:"Ataque",defense:"Defesa","special-attack":"Ataque esp.","special-defense":"Defesa esp.",speed:"Velocidade"};

let todos = [];            // [{id, nome}]
let filtroTipo = null;     // conjunto de ids ou null
let atual = 0;
const STORAGE_KEY = "pokedex-last-pokemon";
const THEME_KEY = "pokedex-theme";

const $ = id => document.getElementById(id);
const getJSON = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };
const idDe = url => +url.split("/").filter(Boolean).pop();

function definirTema(escuro) {
  document.documentElement.dataset.theme = escuro ? "dark" : "light";
  $("tema").setAttribute("aria-pressed", String(escuro));
  $("tema").setAttribute("aria-label", escuro ? "Ativar modo claro" : "Ativar modo escuro");
  $("tema").textContent = escuro ? "☀" : "☾";
  try {
    localStorage.setItem(THEME_KEY, escuro ? "dark" : "light");
  } catch (e) {
    console.warn("Não foi possível salvar a preferência de tema.", e);
  }
}

let temaInicial = false;
try {
  temaInicial = localStorage.getItem(THEME_KEY) === "dark";
} catch (e) {
  console.warn("Não foi possível carregar a preferência de tema.", e);
}
definirTema(temaInicial);
$("tema").addEventListener("click", () => definirTema(document.documentElement.dataset.theme !== "dark"));

function desenharLista() {
  const q = $("busca").value.trim().toLowerCase();
  const itens = todos.filter(p =>
    (!filtroTipo || filtroTipo.has(p.id)) &&
    (!q || p.nome.includes(q) || String(p.id) === q || String(p.id).padStart(3, "0").includes(q)));
  $("lista").innerHTML = itens.length ? itens.map(p =>
    `<li><button data-id="${p.id}" class="${p.id === atual ? "on" : ""}"><img src="${SMALL(p.id)}" alt="" loading="lazy"><span class="num">#${String(p.id).padStart(3, "0")}</span> ${p.nome}</button></li>`
  ).join("") : `<li class="msg">Nenhum Pokémon encontrado.</li>`;
}

function plano(chain) {  // lista simples de todos os estágios da cadeia
  const out = [];
  (function andar(no, nivel) {
    out.push({nome: no.species.name, id: idDe(no.species.url), nivel});
    no.evolves_to.forEach(n => andar(n, nivel + 1));
  })(chain, 0);
  return out.filter(e => e.id <= 151);
}

async function mostrar(id) {
  atual = id;
  localStorage.setItem(STORAGE_KEY, String(id));
  desenharLista();
  $("tela").innerHTML = `<p class="msg">Buscando dados...</p>`;
  try {
    const [p, esp] = await Promise.all([getJSON(API + "pokemon/" + id), getJSON(API + "pokemon-species/" + id)]);
    const cadeia = await getJSON(esp.evolution_chain.url);
    const evo = plano(cadeia.chain);
    const entradasLore = [...esp.flavor_text_entries].reverse();
    const entradaLore = entradasLore.find(t => t.language.name.toLowerCase().replace("_", "-") === "pt-br")
      || entradasLore.find(t => t.language.name.toLowerCase() === "pt")
      || entradasLore.find(t => t.language.name.toLowerCase() === "en");
    const texto = (entradaLore?.flavor_text || "").replace(/[\n\f]/g, " ").replace(/\s+/g, " ").trim();
    if (id !== atual) return;
    $("tela").innerHTML = `
      <div class="hero">
        <img src="${IMG(id)}" alt="${p.name}">
        <div>
          <div class="num">#${String(id).padStart(3, "0")}</div>
          <h2>${p.name}</h2>
          <div class="tipos">${p.types.map(t => `<span class="tipo" style="background:${TIPOS[t.type.name][1]}">${TIPOS[t.type.name][0]}</span>`).join("")}</div>
          <p class="info">Altura: ${p.height / 10} m · Peso: ${p.weight / 10} kg</p>
        </div>
      </div>
      <h3>Lore</h3>
      <p class="info">${texto}</p>
      <h3>Status</h3>
      ${p.stats.map(s => `<div class="stat"><span>${STATS[s.stat.name]}</span><b>${s.base_stat}</b><div class="bar"><i style="width:${Math.min(100, s.base_stat / 2)}%"></i></div></div>`).join("")}
      <h3>Evoluções</h3>
      <div class="evo">${evo.length > 1 ? evo.map((e, i) => `${i ? "<span>→</span>" : ""}<button data-id="${e.id}"><img src="${SMALL(e.id)}" alt="">${e.nome}</button>`).join("") : "Este Pokémon não evolui."}</div>`;
  } catch (e) {
    $("tela").innerHTML = `<p class="msg">Não consegui carregar os dados. Verifique sua internet e tente de novo.</p>`;
  }
}

async function filtrarTipo(t) {
  if (!t) { filtroTipo = null; return desenharLista(); }
  $("lista").innerHTML = `<li class="msg">Filtrando...</li>`;
  try {
    const d = await getJSON(API + "type/" + t);
    filtroTipo = new Set(d.pokemon.map(x => idDe(x.pokemon.url)).filter(i => i <= 151));
  } catch (e) { filtroTipo = null; }
  desenharLista();
}

async function iniciar() {
  $("tipo").insertAdjacentHTML("beforeend", Object.entries(TIPOS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join(""));
  try {
    const d = await getJSON(API + "pokemon?limit=151");
    todos = d.results.map(r => ({id: idDe(r.url), nome: r.name}));
    $("aleatorio").disabled = false;
    desenharLista();
    const salvo = Number(localStorage.getItem(STORAGE_KEY));
    const inicial = Number.isInteger(salvo) && salvo >= 1 && salvo <= 151 ? salvo : 25;
    mostrar(inicial);  // restaura o último Pokémon ou começa com o Pikachu
  } catch (e) {
    $("tela").innerHTML = `<p class="msg">Não consegui falar com a PokéAPI. Verifique sua internet e recarregue a página.</p>`;
  }
}

$("busca").addEventListener("input", desenharLista);
$("tipo").addEventListener("change", e => filtrarTipo(e.target.value));
$("aleatorio").addEventListener("click", () => {
  if (!todos.length) return;
  $("busca").value = "";
  $("tipo").value = "";
  filtroTipo = null;
  mostrar(todos[Math.floor(Math.random() * todos.length)].id);
});
document.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) mostrar(+b.dataset.id); });
iniciar();
</script>
</body>
</html>
